openapi: 3.1.0
info:
  title: eOpenCA Sentin8:BFF API
  description: eOpenCA Backend for Frontend (Sentin8:BFF) API surface. FDX Data Recipient demo.
  version: 0.1.0
servers:
  # The per-instance Sentin8:BFF. The hostname is derived at runtime as
  # `bff.{app_domain}` where the app domain is
  # `{app_slug}.{env_slug}.{org_domain}` (org domain = custom domain or
  # `{org_slug}.{SENTIN8_DOMAIN}`) - never a fixed literal; any
  # `{SENTIN8_DOMAIN}` value serves, the dev loop's wildcard zone being
  # one instance.
  - url: https://bff.openfin8-eopenca.{env_slug}.{org_domain}
    description: Per-instance Sentin8:BFF (eOpenCA)
    variables:
      env_slug: {default: prod, description: instance environment slug}
      org_domain: {default: your-org.example.com, description: 'org custom domain or {org_slug}.{SENTIN8_DOMAIN}'}

paths:
  /auth/login:
    get:
      summary: Start OAuth login flow (PKCE S256 via Sentin8:Auth)
      responses:
        '302':
          description: Redirect to Sentin8:Auth authorize endpoint
  /auth/callback:
    get:
      summary: OAuth callback handler
      parameters:
        - {name: code, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
      responses:
        '302':
          description: Redirect to eOpenCA home
    post:
      summary: Programmatic callback (mobile)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: {type: string}
                state: {type: string}
                redirectUri: {type: string, format: uri}
                clientId: {type: string}
                verifier: {type: string}
                authDomain: {type: string}
      responses:
        '200':
          description: Session created
  /auth/session:
    get:
      summary: Get current session
      responses:
        '200':
          description: Session info
        '401':
          description: Not signed in
  /auth/sign-out:
    post:
      summary: Sign out
      parameters:
        - {name: X-Sentin8:BFF-CSRF, in: header, required: true, schema: {type: string}}
      responses:
        '200':
          description: Signed out
  /proxy/fdx/{path}:
    parameters:
      - {name: path, in: path, required: true, schema: {type: string}, description: OpenFin8 recipient API path (e.g. v1/recipient/providers)}
    get:
      summary: Proxy to OpenFin8 recipient (read)
      responses:
        '200':
          description: OpenFin8 response
    post:
      summary: Proxy to OpenFin8 recipient (write - consent start, revoke, refresh)
      parameters:
        - {name: X-Sentin8:BFF-CSRF, in: header, required: true, schema: {type: string}}
      responses:
        '200':
          description: OpenFin8 response
        '409':
          description: Idempotency conflict
  /proxy/db/{path}:
    parameters:
      - {name: path, in: path, required: true, schema: {type: string}}
    get:
      summary: Proxy to Sentin8:DB (read)
      responses:
        '200':
          description: Sentin8:DB response
    post:
      summary: Proxy to Sentin8:DB (write)
      parameters:
        - {name: X-Sentin8:BFF-CSRF, in: header, required: true, schema: {type: string}}
      responses:
        '200':
          description: Sentin8:DB response
  /proxy/storage/{path}:
    parameters:
      - {name: path, in: path, required: true, schema: {type: string}}
    get:
      summary: Proxy to Sentin8:Storage (read)
      responses:
        '200':
          description: Sentin8:Storage response
    post:
      summary: Proxy to Sentin8:Storage (write)
      parameters:
        - {name: X-Sentin8:BFF-CSRF, in: header, required: true, schema: {type: string}}
      responses:
        '200':
          description: Sentin8:Storage response
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
components:
  schemas:
    User:
      type: object
      properties:
        id: {type: string}
        email: {type: string, format: email}
        displayName: {type: string}
        avatarUrl: {type: string, format: uri}